name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Moteur, APK et Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.tools/gradle-home
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Installer Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      # Valide le wrapper et réutilise le cache Gradle entre les compilations.
      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Préparer le SDK Android
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Installer les composants Android du projet
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      # La même commande sert à vérifier le projet localement et sur GitHub.
      - name: Vérifier et compiler
        run: ./scripts/build.sh :core:check :app:assembleDebug :app:lintDebug

      - name: Conserver l’APK de test
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kanji-flashcards-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Conserver les rapports de vérification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            core/build/reports/
          if-no-files-found: ignore
          retention-days: 14
